name: Sync Notion data and publish

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei, every day.
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the latest Notion snapshot
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Save refreshed snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js quote-bodies.js article-bodies.js
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Sync Notion dashboard data"
            # Notion fetching can take minutes; main may have changed meanwhile.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        uses: actions/deploy-pages@v4
