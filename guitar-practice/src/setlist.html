<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目前練團歌單 · 指間</title><link rel="icon" href="icons/favicon-v2.png"><link rel="stylesheet" href="setlist.css?v=6"></head><body>
<!-- GUITAR_NAV -->
<main><header class="page-head"><div><div class="kicker">BAND NOTEBOOK / 練團工作簿</div><h1>把靈感，練成一首歌。</h1><p class="muted">從一個 idea 開始，慢慢整理每一段的聲音。</p></div><div class="actions"><button id="recover">找回歌單</button><button id="export">匯出備份</button><button id="import">匯入備份</button><button class="primary" id="new-song">＋ 新增歌曲</button></div></header><p class="storage-note">未登入時儲存在本機；登入同一 GitHub 帳號後，共用同一份練團歌單。首次連線會合併本機歌曲，原有內容先備份。</p><section class="cloud-panel" id="cloud-panel" aria-label="歌單雲端同步"><div><strong>歌單雲端同步</strong><p data-cloud-status role="status" aria-live="polite">檢查同步連線…</p></div><div class="actions"><a class="cloud-login" data-cloud-login>登入 GitHub 連接歌單</a><button type="button" data-cloud-sync>立即同步</button><a class="quiet" href="https://github.com/marzlo/Personal/blob/main/guitar-practice/CLOUD_SYNC_SETUP.md" target="_blank" rel="noopener noreferrer">連線設定 ↗</a><button type="button" class="quiet" data-cloud-logout hidden>中斷同步</button></div></section><p id="save-status" class="status" role="status" aria-live="polite"></p><div class="workspace"><aside class="song-sidebar" id="song-sidebar"><h2>目前練團歌單 <span id="song-count"></span></h2><input class="search" id="song-search" type="search" placeholder="搜尋歌名或歌手" aria-label="搜尋歌單"><button type="button" class="quiet" id="show-all-songs">顯示全部歌曲</button><div class="song-list" id="song-list"></div></aside><div id="song-detail"></div></div></main>
<dialog id="song-dialog"><form id="song-form"><h2>新增一首練團歌曲</h2><label class="field">歌名<input name="title" required maxlength="160" placeholder="這次要練哪一首？" autofocus></label><label class="field">歌手／團名（選填）<input name="artist" maxlength="160"></label><div class="actions"><button type="button" id="cancel-song">取消</button><button class="primary" type="submit">建立歌曲</button></div></form></dialog><dialog id="recovery-dialog"><h2>找回歌單</h2><p class="hint">只讀取這個瀏覽器的儲存與歷史備份；合併時不移除目前的歌曲。</p><div id="recovery-list"></div><div class="actions"><button id="close-recovery">關閉</button></div></dialog><input id="import-file" type="file" accept="application/json,.json"><script src="../sync-worker-config.js"></script><script type="module" src="setlist.js?v=8"></script><script defer src="../offline.js" data-personal-offline></script></body></html>
