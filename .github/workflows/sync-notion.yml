name: Sync Notion data and publish

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei, every day.
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore unchanged Notion page cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/notion-sync-cache/data.json
          key: notion-pages-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: notion-pages-v1-

      - name: Refresh the Notion snapshot and save it to main
        env:
          NOTION_CACHE_PATH: ${{ runner.temp }}/notion-sync-cache/data.json
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate the snapshot from the latest main on each attempt.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach FETCH_HEAD
            node scripts/sync-notion.mjs
            git add data.js quote-bodies.js article-bodies.js
            if git diff --cached --quiet; then
              echo "No snapshot changes to commit."
            else
              git commit -m "Sync Notion dashboard data"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Snapshot push failed on attempt $attempt of 3."
          done
          exit 1

      # Pillow 10.4 provides wheels for Python 3.12; avoid runner-default drift.
      - name: Set up Python for article thumbnails
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate article link previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --only-binary=:all: Pillow==10.4.0
          node scripts/build-share-pages.mjs
          python scripts/build-share-images.py

      - name: Prepare offline reading assets
        run: node scripts/build-offline-assets.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        uses: ./.github/actions/deploy-pages
        with:
          artifact-id: ${{ steps.upload.outputs.artifact_id }}
