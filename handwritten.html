<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手寫拾記｜拾頁</title><meta name="description" content="手寫閱讀筆記與原始照片對照，留下字句與思考。"><link rel="icon" href="icons/home/favicon.png"><link rel="stylesheet" href="handwritten.css"><link rel="stylesheet" href="notes-sync.css"><script src="sync-worker-config.js"></script><script src="notes-sync.js"></script><script defer src="handwritten-data.js"></script><script defer src="handwritten-imports.js"></script><script defer src="handwritten-sync.js"></script><script defer src="handwritten.js"></script></head><body class="notes-visitor"><main>
<header><a class="brand" href="./">📖 拾頁</a><nav aria-label="導覽"><a href="./">← 回到拾頁</a><a href="podcast.html">Podcast 聽讀筆記 ↗</a><a href="guitar-practice/">吉他練習・指間 ↗</a></nav></header>
<section class="hero"><small>留下字句，也留下思考</small><h1>手寫拾記</h1><p>把紙上的筆記，慢慢整理成可以分享的閱讀片段。</p><p class="notice">已轉錄筆記皆保留原圖供校對。「機器辨識草稿」尚未逐字核對，可能有錯字、漏字與分段錯誤；「待確認」標示需要優先核對的文字。可依校對狀態篩選。照片中的觀點依原筆記保留。</p></section>
<div class="filters"><label>搜尋筆記<input id="noteSearch" type="search" placeholder="標題、正文或旁註"></label><label>主題<select id="noteTopic"><option value="">全部主題</option></select></label><label>校對狀態<select id="noteState"><option value="">全部狀態</option><option value="needs-photo">需補清晰照片</option><option value="untranscribed">待轉錄</option><option value="ocr-draft">機器辨識草稿</option><option value="pending">待校對</option><option value="reviewed">已校對</option></select></label><label>排序<select id="noteSort"><option value="photo">照片檔名：小到大</option><option value="handwritten">手寫編號：小到大</option></select></label></div>
<p id="noteCount" role="status"></p><div id="noteList"></div><p id="handwrittenStatus" role="status" aria-live="polite"></p><div class="actions"><button id="handwrittenRetry" type="button">重新同步校訂</button><button id="handwrittenExport" type="button">匯出校訂備份</button></div>
<section aria-label="登入與同步"><div class="sync-topbar"></div></section><footer>拾頁 · 紅字提問、旁註與正文分開保留，原始照片可點開放大；未收到的照片會標示待補。</footer>
</main><dialog id="photoDialog"><button id="closePhoto" type="button">關閉照片</button><img alt="手寫筆記原始照片"></dialog><script defer src="offline.js" data-personal-offline></script></body></html>
