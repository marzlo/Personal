<section class="hero"><small>留下字句，也留下思考</small><h1>手寫拾記</h1><p>把紙上的筆記，慢慢整理成可以分享的閱讀片段。</p><p class="notice">目前兩篇為依照片辨識的轉錄草稿，尚未校對。〔待確認〕表示疑字；照片中的觀點依原筆記保留。</p></section>
<div class="filters"><label>搜尋筆記<input id="noteSearch" type="search" placeholder="標題、正文或旁註"></label><label>主題<select id="noteTopic"><option value="">全部主題</option></select></label><label>校對狀態<select id="noteState"><option value="">全部狀態</option><option value="pending">待校對</option><option value="reviewed">已校對</option></select></label></div>
<p id="noteCount" role="status"></p><div id="noteList"></div><p id="handwrittenStatus" role="status" aria-live="polite"></p>
<section aria-label="登入與同步"><div class="sync-topbar"></div></section><footer>拾頁 · 紅字提問、旁註與正文分開保留，原始照片待補。</footer>
</main><dialog id="photoDialog"><button id="closePhoto" type="button">關閉照片</button><img alt="手寫筆記原始照片"></dialog><script defer src="offline.js" data-personal-offline></script></body></html>
