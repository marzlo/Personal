<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>目前練團歌單 · 指間</title><link rel="icon" href="icons/favicon-v2.png"><link rel="stylesheet" href="setlist.css?v=1"></head><body>
<!-- GUITAR_NAV -->
<main><header class="page-head"><div><div class="kicker">BAND NOTEBOOK / 練團工作簿</div><h1>把靈感，練成一首歌。</h1><p class="muted">從一個 idea 開始，慢慢整理每一段的聲音。</p></div><div class="actions"><button id="export">匯出備份</button><button id="import">匯入備份</button><button class="primary" id="new-song">＋ 新增歌曲</button></div></header><p class="storage-note">目前練團歌單儲存在這個瀏覽器，不會自動同步至其他裝置。換裝置或清除資料前，請先匯出備份。</p><p id="save-status" class="status" role="status" aria-live="polite"></p><div class="workspace"><aside class="song-sidebar" id="song-sidebar"><h2>目前練團歌單 <span id="song-count"></span></h2><input class="search" id="song-search" type="search" placeholder="搜尋歌名或歌手" aria-label="搜尋歌單"><div class="song-list" id="song-list"></div></aside><div id="song-detail"></div></div></main>
<dialog id="song-dialog"><form id="song-form"><h2>新增一首練團歌曲</h2><label class="field">歌名<input name="title" required maxlength="160" placeholder="這次要練哪一首？" autofocus></label><label class="field">歌手／團名（選填）<input name="artist" maxlength="160"></label><div class="actions"><button type="button" id="cancel-song">取消</button><button class="primary" type="submit">建立歌曲</button></div></form></dialog><input id="import-file" type="file" accept="application/json,.json"><script type="module" src="setlist.js?v=1"></script></body></html>
