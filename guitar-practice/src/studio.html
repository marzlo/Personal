<div id="guitar-design">
<style>
#guitar-design{font-family:Inter,'Microsoft JhengHei',sans-serif;color-scheme:light dark;--paper:light-dark(#f4f3ed,#171b1a);--panel:light-dark(#fffef8,#222826);--ink:light-dark(#202e29,#e7eee8);--soft:light-dark(#64716a,#a0afa6);--line:light-dark(#d8ded4,#3b4840);--mark:light-dark(#24684c,#b4e2ac);--on:light-dark(#ffffff,#18241b);color:var(--ink)}
#guitar-design *{box-sizing:border-box}#guitar-design .app{background:var(--paper);border-radius:20px;padding:28px;min-height:620px}#guitar-design header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:20px;padding-right:80px}#guitar-design .brand{font-weight:700;letter-spacing:2px}#guitar-design .sub{font-size:12px;color:var(--soft)}#guitar-design .layout{display:grid;grid-template-columns:160px 1fr;gap:32px;margin-top:25px}#guitar-design nav{display:flex;flex-direction:column;gap:10px}#guitar-design button,#guitar-design select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--panel);color:var(--ink)}#guitar-design button.active,#guitar-design .primary{background:var(--mark);color:var(--on);border-color:transparent}#guitar-design nav button{text-align:left}#guitar-design .eyebrow{color:var(--soft);font-size:12px;letter-spacing:2px}#guitar-design h2{font-size:30px;font-weight:600;margin:8px 0}#guitar-design p{color:var(--soft);font-size:14px;margin:8px 0 23px}#guitar-design .toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:24px 0}#guitar-design label{font-size:12px;color:var(--soft);display:grid;gap:8px}#guitar-design .board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px}#guitar-design .strings{display:grid;grid-template-columns:24px repeat(6,1fr)}#guitar-design .cell{height:40px;display:flex;align-items:center;justify-content:center;position:relative;border-right:1px solid var(--line)}#guitar-design .cell:before{content:'';height:1px;background:var(--line);position:absolute;left:0;right:0}#guitar-design .note{z-index:1;width:29px;height:29px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;border:1px solid var(--line)}#guitar-design .root{background:var(--mark);color:var(--on);border:0}#guitar-design .fret{font-size:11px;color:var(--soft);text-align:center;margin-top:12px}#guitar-design .legend{display:flex;gap:18px;font-size:12px;color:var(--soft);margin:16px 0 26px}#guitar-design .lesson{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid var(--line);padding-top:22px}#guitar-design h3{font-size:17px;font-weight:500;margin:7px 0}#guitar-design .mobile{max-width:410px;margin:auto}#guitar-design .mobile header{padding-right:30px}#guitar-design .mobile .layout{display:block}#guitar-design .mobile nav{flex-direction:row;margin-bottom:28px}#guitar-design .mobile nav button{flex:1;padding:10px}#guitar-design .mobile .lesson{display:block}#guitar-design .mobile .lesson button{width:100%;margin-top:14px}#guitar-design .mobile h2{font-size:27px}#guitar-design .stage{min-height:720px}#guitar-design .status{font-size:12px;color:var(--soft);min-height:18px;margin-top:10px}@media(max-width:650px){#guitar-design .app{padding:18px}#guitar-design .layout{display:block}#guitar-design nav{flex-direction:row;margin-bottom:25px}#guitar-design nav button{padding:10px;font-size:13px}#guitar-design .lesson{flex-wrap:wrap}#guitar-design header{padding-right:65px}#guitar-design .brand{letter-spacing:0}#guitar-design .stage{min-height:800px}}
</style>
<div class="viz-carousel" aria-label="吉他練習介面設計" data-previous-label="上一款" data-next-label="下一款">
<section class="stage" data-variant="指板工作室"><div class="app" data-app>
<header><span class="brand">FRET / 指間</span><span class="sub">每天，熟悉一點指板。</span></header>
<div class="layout"><nav aria-label="練習類型"><button class="cursor-interaction active" data-mode="音階">音階探索</button><button class="cursor-interaction" data-mode="和弦">和弦組成</button></nav><main>
<div class="eyebrow">EXPLORE THE FRETBOARD</div><h2 data-title>C 大調音階</h2><p>從一個根音出發，找到音與音之間的關係。</p>
<div class="toolbar"><label>根音<select class="cursor-interaction" data-key><option>C</option><option>D</option><option>E</option><option>G</option><option>A</option></select></label><label>類型<select class="cursor-interaction" data-type><option>大調音階</option><option>自然小調</option><option>小調五聲音階</option></select></label><button class="cursor-interaction" data-label>切換為級數</button></div>
<div class="board" data-board aria-label="標準調弦，零至五格指板"></div><div class="legend"><span>● 實心：根音</span><span>○ 空心：其他組成音</span><span>標準調弦 E A D G B E</span></div>
<div class="lesson"><div><span class="eyebrow">輪到你了</span><h3 data-prompt>找出指板上所有的 C</h3><span class="sub">先觀察位置，再查看答案。</span></div><button class="primary cursor-interaction" data-challenge>開始找音練習 →</button></div><div class="status" aria-live="polite"></div>
</main></div></div></section>
<section class="stage viz-dotted-background" data-variant="手機專注版" hidden><div class="app mobile" data-app>
<header><span class="brand">FRET / 指間</span><span class="sub">吉他練習</span></header><div class="layout"><nav aria-label="練習類型"><button class="cursor-interaction active" data-mode="音階">音階探索</button><button class="cursor-interaction" data-mode="和弦">和弦組成</button></nav><main><div class="eyebrow">一次，練好一件事</div><h2 data-title>C 大調音階</h2><div class="toolbar"><label>根音<select class="cursor-interaction" data-key><option>C</option><option>D</option><option>E</option><option>G</option><option>A</option></select></label><label>類型<select class="cursor-interaction" data-type><option>大調音階</option><option>自然小調</option><option>小調五聲音階</option></select></label><button class="cursor-interaction" data-label>切換為級數</button></div><div class="board" data-board aria-label="標準調弦，零至五格指板"></div><div class="legend"><span>● 根音</span><span>○ 其他組成音</span></div><div class="lesson"><div><span class="eyebrow">輪到你了</span><h3 data-prompt>找出指板上所有的 C</h3><span class="sub">不急著背，先找到它。</span></div><button class="primary cursor-interaction" data-challenge>開始找音練習 →</button></div><div class="status" aria-live="polite"></div></main></div></div></section>
</div>
<script>
(()=>{const root=document.getElementById('guitar-design');const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];root.querySelectorAll('[data-app]').forEach(app=>{let mode='音階',degree=false,challenge=false;const key=app.querySelector('[data-key]'),type=app.querySelector('[data-type]'),board=app.querySelector('[data-board]'),status=app.querySelector('.status');function render(){const tonic=names.indexOf(key.value),intervals=mode==='和弦'?(type.value==='小三和弦'?[0,3,7]:type.value==='屬七和弦'?[0,4,7,10]:[0,4,7]):type.value==='自然小調'?[0,2,3,5,7,8,10]:type.value==='小調五聲音階'?[0,3,5,7,10]:[0,2,4,5,7,9,11];app.querySelector('[data-title]').textContent=key.value+' '+type.value;app.querySelector('[data-prompt]').textContent='找出指板上所有的 '+key.value;let html='<div class="strings">';[4,11,7,2,9,4].forEach(open=>{html+='<div class="cell">'+names[open]+'</div>';for(let f=0;f<6;f++){const pitch=(open+f)%12,delta=(pitch-tonic+12)%12;const index=intervals.indexOf(delta);const degrees={0:'1',2:'2',3:'♭3',4:'3',5:'4',7:'5',8:'♭6',9:'6',10:'♭7',11:'7'};html+='<div class="cell">'+(index>=0&&(!challenge||delta===0)?'<span class="note '+(delta===0?'root':'')+'">'+(degree?degrees[delta]:names[pitch])+'</span>':'')+'</div>'}});html+='</div><div class="strings"><span></span>';for(let f=0;f<6;f++)html+='<span class="fret">'+f+'</span>';board.innerHTML=html+'</div>'}key.onchange=()=>{challenge=false;render()};type.onchange=()=>{challenge=false;render()};app.querySelector('[data-label]').onclick=e=>{degree=!degree;e.target.textContent=degree?'切換為音名':'切換為級數';render()};app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));type.innerHTML=(mode==='和弦'?['大三和弦','小三和弦','屬七和弦']:['大調音階','自然小調','小調五聲音階']).map(v=>'<option>'+v+'</option>').join('');challenge=false;render()});app.querySelector('[data-challenge]').onclick=e=>{challenge=!challenge;e.target.textContent=challenge?'返回完整指板':'開始找音練習 →';status.textContent=challenge?'設計預覽：聚焦根音位置。正式版會加入點選作答。':'';render()};render()})})();
</script>
</div>
