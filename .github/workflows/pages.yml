name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pillow 10.4 provides wheels for Python 3.12; avoid runner-default drift.
      - name: Set up Python for article thumbnails
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate article link previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --only-binary=:all: Pillow==10.4.0
          node scripts/build-share-pages.mjs
          python scripts/build-share-images.py

      - name: Prepare offline reading assets
        run: node scripts/build-offline-assets.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
