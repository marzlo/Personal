<div class="shell">
<header><span class="brand">FRET / 指間</span><span class="muted">級數配和弦</span></header>
<h2>同一個級數，找到不同的聲音。</h2><p class="intro">選調性與和弦進行，再探索適用的和弦種類及按法。</p>
<div class="topline"><label>主音<select class="cursor-interaction" data-key aria-label="主音"></select></label><label>調式<select class="cursor-interaction" data-mode aria-label="調式"></select></label><label>選取方式<select class="cursor-interaction" data-input-mode aria-label="和弦選取方式"><option value="notes">音名（C、D、E…）</option><option value="degrees">級數（第1級、第2級…）</option></select></label></div>
<div class="progression-tools"><span class="tag">和弦進行 · 可新增與移除</span><button class="cursor-interaction" type="button" data-add-chord>＋ 新增和弦</button></div><div class="steps" data-steps></div>
<div class="sequence" aria-label="和弦級數，點選查看適用種類" data-sequence></div>
<div class="content"><section><span class="tag" data-context></span><h3 data-heading></h3><div class="types" data-types aria-label="適用和弦種類"></div><div class="reason" data-reason aria-live="polite"></div><details><summary class="cursor-interaction">其他色彩：含調外音的和弦</summary><div class="types outside" data-outside></div></details><div class="notice">「調內」表示組成音皆在目前調式內。實際搭配仍需聽旋律與前後和弦；含調外音也可以使用。</div></section>
<section class="chordpanel" aria-label="所選和弦按法"><span class="tag">按法預覽 · 標準調弦</span><h3 data-chordtitle></h3><div class="notes" data-tones></div><div class="chart" data-chart></div><div class="notes" data-shapeinfo></div><p class="notice" data-shapesource></p><div class="shapes"><button class="cursor-interaction" data-shape="0" aria-pressed="true">六弦根音</button><button class="cursor-interaction" data-shape="1" aria-pressed="false">五弦根音</button></div><div class="notice">● 按弦位置　○ 空弦　× 不彈<br>圓點內為音名；此圖尚未標註手指編號。</div></section></div>
<div class="degreebar" aria-label="目前調式七個基本和弦" data-degreebar></div>
<div class="notice" data-scale-notes></div>
</div>
<script>
(()=>{
const root=document.getElementById('fret-harmony'),$=s=>root.querySelector(s);
const pcs=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const letters=['C','D','E','F','G','A','B'],naturals=[0,2,4,5,7,9,11];
const modes={major:{name:'大調',iv:[0,2,4,5,7,9,11]},natural:{name:'自然小調',iv:[0,2,3,5,7,8,10]},harmonic:{name:'和聲小調',iv:[0,2,3,5,7,8,11]},melodic:{name:'旋律小調（爵士）',iv:[0,2,3,5,7,9,11]}};
const defs=[
{id:'maj',suffix:'',name:'大三和弦',iv:[0,4,7],sh:[[0,2,2,1,0,0],[null,0,2,2,2,0]]},
{id:'maj7',suffix:'maj7',name:'大七和弦',iv:[0,4,7,11],sh:[[0,null,1,1,0,null],[null,0,2,1,2,0]]},
{id:'add9',suffix:'add9',name:'加九和弦',iv:[0,4,7,2],sh:[[0,null,2,1,0,2],[null,0,-1,-3,0,null]]},
{id:'6',suffix:'6',name:'六和弦',iv:[0,4,7,9],sh:[[0,null,2,1,2,null],[null,0,2,2,2,2]]},
{id:'maj9',suffix:'maj9',name:'大九和弦',iv:[0,4,7,11,2],sh:[[0,-1,1,-1,null,null],[null,0,-1,1,0,null]]},
{id:'min',suffix:'m',name:'小三和弦',iv:[0,3,7],sh:[[0,2,2,0,0,0],[null,0,2,2,1,0]]},
{id:'m7',suffix:'m7',name:'小七和弦',iv:[0,3,7,10],sh:[[0,null,0,0,0,null],[null,0,2,0,1,0]]},
{id:'m9',suffix:'m9',name:'小九和弦',iv:[0,3,7,10,2],sh:[[0,2,0,0,0,2],[null,0,-2,0,0,null]]},
{id:'m11',suffix:'m11',name:'小十一和弦',iv:[0,3,7,10,2,5],sh:[[0,null,0,0,-2,null],[null,0,0,0,1,0]]},
{id:'m6',suffix:'m6',name:'小六和弦',iv:[0,3,7,9],sh:[[0,null,-1,0,0,null],[null,0,2,2,1,2]]},
{id:'7',suffix:'7',name:'屬七和弦',iv:[0,4,7,10],sh:[[0,2,0,1,0,0],[null,0,2,0,2,0]]},
{id:'9',suffix:'9',name:'屬九和弦',iv:[0,4,7,10,2],sh:[[0,null,0,1,0,2],[null,0,-1,0,0,null]]},
{id:'sus2',suffix:'sus2',name:'掛二和弦',iv:[0,2,7],sh:[[0,null,null,-1,0,0],[null,0,2,2,0,0]]},
{id:'sus4',suffix:'sus4',name:'掛四和弦',iv:[0,5,7],sh:[[0,2,2,2,0,0],[null,0,2,2,3,0]]},
{id:'7sus4',suffix:'7sus4',name:'屬七掛四',iv:[0,5,7,10],sh:[[0,2,0,2,0,0],[null,0,2,0,3,0]]},
{id:'m7b5',suffix:'m7♭5',name:'半減七和弦',iv:[0,3,6,10],sh:[[0,null,0,0,-1,null],[null,0,1,0,1,null]]},
{id:'dim7',suffix:'dim7',name:'減七和弦',iv:[0,3,6,9],sh:[[0,null,-1,0,-1,null],[null,0,1,-1,1,null]]}
];
defs.push(
{id:'dim',suffix:'dim',name:'減三和弦',iv:[0,3,6],sh:[[0,1,2,0,null,null],[null,0,1,2,1,null]]},
{id:'aug',suffix:'aug',name:'增三和弦',iv:[0,4,8],sh:[[0,null,2,1,1,0],[null,0,3,2,2,1]]},
{id:'mMaj7',suffix:'m(maj7)',name:'小大七和弦',iv:[0,3,7,11],sh:[[0,null,1,0,0,null],[null,0,2,1,1,0]]},
{id:'augMaj7',suffix:'maj7(♯5)',name:'增大七和弦',iv:[0,4,8,11],sh:[[0,null,1,1,1,null],[null,0,3,1,2,1]]}
);
// Verified against the embedded William Vinci / Chord Blueprint library.
// Entries identify original page and figure, not fingering numbers.
const shapeSources={
 maj:['第6頁・A 第1圖','第6頁・A 第2圖'],
 min:['第8頁・Am 第1圖','第8頁・Am 第2圖'],
 maj7:['第10頁・Amaj7 第1圖','第10頁・Amaj7 第6圖'],
 add9:['第17頁・A(add9) 第2圖','第17頁・A(add9) 第6圖'],
 maj9:['第23頁・Amaj9 第2圖','第23頁・Amaj9 第1圖'],
 m7:['第12頁・Am7 第3圖','第12頁・Am7 第7圖'],
 m9:['第23頁・Am9 第3圖','第23頁・Am9 第4圖'],
 m11:['第12頁・Am11 第1圖',null],
 m6:['第12頁・Am6 第2圖',null],
 '7':['第14頁・A7 第8圖','第14頁・A7 第9圖'],
 sus2:[null,'第21頁・Asus2 第6圖'],
 sus4:['第21頁・Asus4 第1圖','第21頁・Asus4 第5圖'],
 '7sus4':['第21頁・A7sus4 第2圖','第21頁・A7sus4 第4圖'],
 m7b5:['第19頁・Am7(♭5) 第1圖','第19頁・Am7(♭5) 第3圖'],
 dim7:['第19頁・Adim7 第1圖','第19頁・Adim7 第2圖']
};
let key=9,mode='natural',roots=[9,2,4],active=2,quality='m7',shape=0,inputMode='notes';
function applySaved(saved){const s=saved?.modelContent;if(!s)return;if(Number.isInteger(s.key)&&s.key>=0&&s.key<12)key=s.key;if(modes[s.mode])mode=s.mode;if(Array.isArray(s.roots)&&s.roots.length>=1&&s.roots.every(v=>Number.isInteger(v)&&v>=0&&v<12))roots=s.roots.slice();if(Number.isInteger(s.active))active=Math.max(0,Math.min(roots.length-1,s.active));if(['notes','degrees'].includes(s.inputMode))inputMode=s.inputMode;if(defs.some(d=>d.id===s.quality))quality=s.quality;if([0,1].includes(saved.privateContent?.shape))shape=saved.privateContent.shape}
applySaved(window.openai?.widgetState);
function save(){window.openai?.setWidgetState?.({modelContent:{key,mode,roots,active,quality,inputMode},privateContent:{shape}})?.catch(()=>{})}
const scale=()=>modes[mode].iv.map(v=>(key+v)%12);
function degree(pc){return scale().indexOf(pc)}
function spelling(){const start=letters.indexOf(pcs[key][0]);return scale().map((pc,i)=>{const index=(start+i)%7;let difference=(pc-naturals[index]+12)%12;if(difference>6)difference-=12;return letters[index]+(difference>0?'♯'.repeat(difference):'♭'.repeat(-difference))})}
function note(pc){const d=degree(pc);return d<0?pcs[pc]:spelling()[d]}
function inScale(d,pc){return d.iv.every(i=>scale().includes((pc+i)%12))}
function stacked(pc,seventh){const degreeIndex=degree(pc);if(degreeIndex<0)return defs.find(d=>d.id===(seventh?'7':'maj'));const all=scale(),intervals=[0,2,4,...(seventh?[6]:[])].map(n=>(all[(degreeIndex+n)%7]-pc+12)%12);return defs.find(d=>d.iv.length===intervals.length&&intervals.every(v=>d.iv.includes(v)))||defs[0]}
function label(pc){const i=degree(pc);if(i<0){const delta=(pc-key+12)%12;return ({0:'I',1:'♭II',2:'II',3:'♭III',4:'III',5:'IV',6:'♯IV / ♭V',7:'V',8:'♭VI',9:'VI',10:'♭VII',11:'VII'}[delta])+' · 調外根音'}const triad=stacked(pc,false);let roman=['I','II','III','IV','V','VI','VII'][i];if(triad.id==='min'||triad.id==='dim')roman=roman.toLowerCase();if(triad.id==='dim')roman+='°';if(triad.id==='aug')roman+='+';return roman+' · '+(i+1)+' 級'}
function resetQuality(){quality=stacked(roots[active],true).id}
function makeButton(d,pc){const b=document.createElement('button');b.className='cursor-interaction';b.setAttribute('aria-pressed',String(d.id===quality));const strong=document.createElement('strong');strong.textContent=note(pc)+d.suffix;const small=document.createElement('small');small.textContent=d.name;b.append(strong,small);b.onclick=()=>{quality=d.id;render();save()};return b}
function chart(d,pc){const opens=[4,9,2,7,11,4];let fret=(pc-(shape?9:4)+12)%12;const pattern=d.sh[shape];if(fret+Math.min(...pattern.filter(x=>x!==null))<0)fret+=12;const frets=pattern.map(x=>x===null?null:x+fret);const positive=frets.filter(x=>x>0),start=positive.length?Math.min(...positive):1,rows=positive.length?Math.max(4,Math.max(...positive)-start+1):4,height=68+rows*35;
let svg='<svg viewBox="0 0 210 '+height+'" role="img" aria-label="'+note(pc)+d.suffix+'，六弦至一弦 '+frets.map(f=>f===null?'不彈':f+'格').join('、')+'"><title>'+note(pc)+d.suffix+' 按法</title>';
for(let i=0;i<6;i++){let x=35+i*29;svg+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="'+(40+rows*35)+'"/>';if(frets[i]===null||frets[i]===0)svg+='<text x="'+x+'" y="25" text-anchor="middle">'+(frets[i]===null?'×':'○')+'</text>';svg+='<text x="'+x+'" y="'+(height-5)+'" text-anchor="middle">'+['E','A','D','G','B','E'][i]+'</text>'}
for(let i=0;i<=rows;i++)svg+='<line x1="35" y1="'+(40+i*35)+'" x2="180" y2="'+(40+i*35)+'"/>';svg+='<text x="8" y="63">'+start+'</text>';
frets.forEach((f,i)=>{if(f>0){const x=35+i*29,y=40+(f-start+.5)*35;svg+='<circle class="dot" cx="'+x+'" cy="'+y+'" r="12"/><text class="dottext" x="'+x+'" y="'+(y+4)+'" text-anchor="middle">'+note((opens[i]+f)%12)+'</text>'}});$('[data-chart]').innerHTML=svg+'</svg>';
const reference=shapeSources[d.id]?.[shape];$('[data-shapesource]').textContent=reference?'圖庫參照：William Vinci / Chord Blueprint '+reference+'，按根音移調。':'補充按法：圖庫未收錄此種類的這個根音位置；已檢查組成音。';
const played=frets.map((f,i)=>f===null?null:(opens[i]+f)%12);const missing=d.iv.map(i=>(pc+i)%12).filter(p=>!played.includes(p));$('[data-shapeinfo]').textContent='六弦 → 一弦：'+frets.map(f=>f===null?'×':f).join(' · ')+(missing.length?'；此按法省略 '+missing.map(note).join('、'):'')}
function renderSteps(){
 const host=$('[data-steps]');host.replaceChildren();$('[data-input-mode]').value=inputMode;
 roots.forEach((pc,i)=>{
  const group=document.createElement('div');group.className='progression-step';
  const labelNode=document.createElement('label');labelNode.textContent='第 '+(i+1)+' 個和弦';
  const select=document.createElement('select');select.dataset.root=String(i);select.className='cursor-interaction';select.setAttribute('aria-label','第 '+(i+1)+' 個和弦'+(inputMode==='degrees'?'級數':'音名'));
  function option(parent,pitch,text){const o=document.createElement('option');o.value=String(pitch);o.textContent=text;parent.append(o)}
  if(inputMode==='degrees'){
   const inside=document.createElement('optgroup');inside.label='調內級數';scale().forEach(pitch=>option(inside,pitch,label(pitch)+' · '+note(pitch)));select.append(inside);
   const outside=document.createElement('optgroup');outside.label='調外根音';pcs.forEach((name,pitch)=>{if(degree(pitch)<0)option(outside,pitch,label(pitch)+' · '+name)});select.append(outside);
  }else pcs.forEach((name,pitch)=>option(select,pitch,note(pitch)));
  select.value=String(pc);select.onchange=()=>{roots[i]=Number(select.value);active=i;resetQuality();render();save()};labelNode.append(select);
  const remove=document.createElement('button');remove.type='button';remove.className='cursor-interaction remove-step';remove.textContent='×';remove.setAttribute('aria-label','移除第 '+(i+1)+' 個和弦');remove.disabled=roots.length===1;
  remove.onclick=()=>{if(roots.length<=1)return;const wasActive=active===i;roots.splice(i,1);if(active>i)active--;active=Math.min(active,roots.length-1);if(wasActive)resetQuality();render();save()};
  group.append(labelNode,remove);host.append(group);
 });
}
function changeTonality(nextKey,nextMode){
 const previous=scale(),next=modes[nextMode].iv.map(v=>(nextKey+v)%12),delta=nextKey-key;
 if(inputMode==='degrees')roots=roots.map(pc=>{const degreeIndex=previous.indexOf(pc);return degreeIndex>=0?next[degreeIndex]:(pc+delta+12)%12});
 key=nextKey;mode=nextMode;resetQuality();render();save();
}
function render(){const pc=roots[active],d=defs.find(v=>v.id===quality)||defs[0];$('[data-key]').value=key;$('[data-mode]').value=mode;renderSteps();
const seq=$('[data-sequence]');seq.replaceChildren();roots.forEach((r,i)=>{const b=document.createElement('button');b.className='cursor-interaction';b.setAttribute('aria-pressed',String(active===i));const name=document.createElement('span');name.className='chordname';name.textContent=note(r)+(i===active?d.suffix:stacked(r,false).suffix);const deg=document.createElement('span');deg.className='degree';deg.textContent=label(r);const small=document.createElement('small');small.textContent=active===i?'正在探索 ↓':'點選查看可用和弦';b.append(name,deg,small);b.onclick=()=>{active=i;resetQuality();render();save()};seq.appendChild(b)});
$('[data-context]').textContent=pcs[key]+' '+modes[mode].name+' / '+label(pc);$('[data-heading]').textContent=note(pc)+' 可以選哪些和弦？';const inBox=$('[data-types]'),outBox=$('[data-outside]');inBox.replaceChildren();outBox.replaceChildren();defs.forEach(def=>(inScale(def,pc)?inBox:outBox).appendChild(makeButton(def,pc)));if(!inBox.children.length)inBox.textContent='此根音不在本調式內，請展開下方調外和弦。';const seventh=stacked(pc,true);$('[data-reason]').textContent=(degree(pc)>=0?label(pc)+' 疊成的基本七和弦是 '+note(pc)+seventh.suffix+'。':'這是調外根音，需依前後和弦判斷用途。')+' '+(inScale(d,pc)?note(pc)+d.suffix+' 的組成音皆在目前調式內。':note(pc)+d.suffix+' 含調外音，作為額外色彩選擇。');$('[data-chordtitle]').textContent=note(pc)+d.suffix+' · '+d.name;$('[data-tones]').textContent='組成音：'+d.iv.map(i=>note((pc+i)%12)).join(' · ');chart(d,pc);root.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.shape)===shape)));
const bar=$('[data-degreebar]');bar.replaceChildren();scale().forEach(r=>{const item=document.createElement('span'),b=document.createElement('b');b.textContent=note(r)+stacked(r,false).suffix;item.append(b,document.createTextNode(label(r)));bar.appendChild(item)});$('[data-scale-notes]').textContent='本調音階：'+spelling().join(' · ')+(mode==='melodic'?'；採爵士用法，上下行同音階。':'')}
pcs.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;$('[data-key]').appendChild(o)});Object.entries(modes).forEach(([id,m])=>{const o=document.createElement('option');o.value=id;o.textContent=m.name;$('[data-mode]').appendChild(o)});
$('[data-input-mode]').onchange=e=>{inputMode=e.target.value;render();save()};
$('[data-add-chord]').onclick=()=>{roots.push(key);active=roots.length-1;resetQuality();render();save()};
$('[data-key]').onchange=e=>changeTonality(Number(e.target.value),mode);
$('[data-mode]').onchange=e=>changeTonality(key,e.target.value);
root.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{shape=Number(b.dataset.shape);render();save()});window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){applySaved(e.detail.globals.widgetState);render()}});render();
})();

</script>
</div>
